name: Accessibility Check

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**/*.html'
      - '**/*.ts'
      - '**/*.scss'
  push:
    branches: [main, master, develop]

jobs:
  accessibility-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Accessibility Checks
        id: a11y-check
        run: |
          echo "🔍 Running Accessibility Checks using custom rules..."
          
          # Make script executable
          chmod +x .github/scripts/accessibility-checker.js
          
          # Run the accessibility checker
          node .github/scripts/accessibility-checker.js --src=src
          
          # Check exit code
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ No accessibility errors found"
          else
            echo "❌ Accessibility issues detected"
          fi
          
          # Set output for next steps
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          exit $EXIT_CODE

      - name: Upload Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: accessibility-report.md

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('accessibility-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  axe-core-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build -- --configuration development || npm run build

      - name: Install Axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Serve and test with Axe
        run: |
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for server to start..."
          timeout=60
          while ! curl -s http://localhost:4200 > /dev/null; do
            timeout=$((timeout-1))
            if [ $timeout -le 0 ]; then
              echo "Server failed to start"
              kill $SERVER_PID || true
              exit 1
            fi
            sleep 1
          done
          
          echo "Server is ready, running Axe tests..."
          
          # Run axe-core tests
          axe http://localhost:4200 --exit || true
          
          # Cleanup
          kill $SERVER_PID || true

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Accessibility tests failed. Please check the workflow logs for details.'
            });
