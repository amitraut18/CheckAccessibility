name: Accessibility Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.html'
      - '**/*.ts'

jobs:
  accessibility-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Get changed HTML files
        id: changed-files
        run: |
          echo "Checking for changed HTML files..."
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.html$' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -n "$CHANGED_FILES" ]; then
            echo "Found HTML changes:"
            echo "$CHANGED_FILES"
          else
            echo "No HTML files changed"
          fi

      - name: Run accessibility checks
        if: steps.changed-files.outputs.changed_files != ''
        id: a11y-check
        run: |
          node .github/scripts/check-accessibility.js
        continue-on-error: true

      - name: Comment PR with results
        if: steps.changed-files.outputs.changed_files != ''
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');

            let comment = '## 🤖 Accessibility Check Results\n\n';

            try {
              const results = fs.readFileSync('.github/a11y-results.json', 'utf8');
              const data = JSON.parse(results);

              if (data.errors.length === 0) {
                comment += '✅ **All accessibility checks passed!**\n\n';
                comment += `Checked ${data.filesChecked} HTML file(s).\n`;
              } else {
                comment += '❌ **Accessibility issues found:**\n\n';
                comment += `Checked ${data.filesChecked} file(s), found ${data.errors.length} issue(s).\n\n`;
                
                data.errors.forEach(error => {
                  comment += `### 📄 \`${error.file}\`\n`;
                  comment += `**Line ${error.line}:** ${error.message}\n`;
                  comment += '```html\n' + error.code + '\n```\n';
                  comment += `**Fix:** ${error.fix}\n\n`;
                });

                comment += '\n---\n';
                comment += '💡 **Quick fixes:**\n';
                comment += '- Review [Accessibility Guidelines](.github/copilot-instructions.md)\n';
                comment += '- Use [Quick Reference](.github/ACCESSIBILITY_QUICK_REFERENCE.md)\n';
                comment += '- Ask Copilot: `@workspace Make this component accessible`\n';
              }
            } catch (error) {
              comment += '⚠️ Error reading accessibility check results.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if accessibility issues found
        if: steps.a11y-check.outcome == 'failure'
        run: |
          echo "❌ Accessibility checks failed. Please fix the issues above."
          exit 1
